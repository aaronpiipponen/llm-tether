<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">llm-tether architecture</title>
  <desc id="d">The llm-tether command writes an OpenCode provider entry and starts an SSH keeper. OpenCode requests the keeper's local port, and the keeper forwards the request to llama-server on the GPU worker.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="12" fill="#232434"/>

  <rect x="32" y="32" width="496" height="296" rx="12" fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="48" y="58" font-size="16" fill="#a3a4b8">VPS</text>

  <rect x="640" y="32" width="288" height="296" rx="12" fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="656" y="58" font-size="16" fill="#a3a4b8">Windows/WSL2 GPU worker</text>

  <rect x="56" y="96" width="144" height="80" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="128" y="130" text-anchor="middle" font-size="16" fill="#ececf2">llm-tether</text>
  <text x="128" y="152" text-anchor="middle" font-size="14" fill="#a3a4b8">operator CLI</text>

  <rect x="336" y="88" width="168" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="420" y="114" text-anchor="middle" font-size="16" fill="#ececf2">OpenCode</text>
  <text x="420" y="136" text-anchor="middle" font-size="14" fill="#a3a4b8">provider client</text>

  <rect x="336" y="216" width="168" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="420" y="242" text-anchor="middle" font-size="16" fill="#ececf2">SSH keeper</text>
  <text x="420" y="264" text-anchor="middle" font-size="14" fill="#a3a4b8">port forward</text>

  <rect x="664" y="152" width="216" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="772" y="178" text-anchor="middle" font-size="16" fill="#ececf2">llama-server</text>
  <text x="772" y="200" text-anchor="middle" font-size="14" fill="#a3a4b8">started over SSH</text>

  <line x1="200" y1="120" x2="336" y2="120" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="208" y="108" font-size="14" fill="#a3a4b8">provider entry</text>

  <path d="M200 152 H268 V248 H336" fill="none" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="208" y="144" font-size="14" fill="#a3a4b8">starts keeper</text>

  <line x1="420" y1="152" x2="420" y2="216" stroke="#a98ae0" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="430" y="188" font-size="14" fill="#a3a4b8">local port</text>

  <path d="M504 248 H596 V184 H664" fill="none" stroke="#a98ae0" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="536" y="268" font-size="14" fill="#a3a4b8">SSH</text>
  <text x="536" y="284" font-size="14" fill="#a3a4b8">tunnel</text>
</svg>
